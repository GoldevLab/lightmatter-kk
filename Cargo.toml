[package]
name = "lightmatter"
version = "0.1.0"
edition = "2021"
description = "Lightmatter — ajuste variacional Kramers–Kronig (Kuzmenko) en Resuma."
rust-version = "1.91"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["server"]
server = ["dep:resuma", "dep:tokio", "dep:axum"]
wasm = ["dep:wasm-bindgen"]

[dependencies]
resuma = { git = "https://github.com/GoldevLab/resuma.git", rev = "36527ae1c1a8fb31d0e3cec3d3abcc9975ba2f7c", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["multipart"], optional = true }
wasm-bindgen = { version = "=0.2.100", optional = true }
