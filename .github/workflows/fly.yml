name: Fly Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create the data volume once
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          existing=$(flyctl volumes list -a lightmatter-kk --json)
          if ! echo "$existing" | jq -e 'map(select(.name=="lightmatter_data")) | length > 0' >/dev/null; then
            flyctl volumes create lightmatter_data --region dfw --size 1 --yes -a lightmatter-kk
          fi
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Start a stopped machine and show its logs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl machine list -a lightmatter-kk --json > /tmp/machines.json
          jq -r '.[] | select(.state=="stopped" or .state=="created") | .id' /tmp/machines.json | while read -r id; do
            [ -z "$id" ] && continue
            echo "starting $id"
            flyctl machine start "$id" -a lightmatter-kk
          done
          sleep 12
          flyctl logs -a lightmatter-kk --no-tail || true
