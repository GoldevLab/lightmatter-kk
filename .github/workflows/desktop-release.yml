name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - desktop-v*

permissions:
  contents: write

jobs:
  windows-desktop:
    name: Build Windows desktop app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build desktop app
        run: cargo tauri build
        working-directory: src-tauri

      - name: Package portable app
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-portable.ps1

      - name: Stage stable download names
        shell: pwsh
        run: |
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if (-not $nsis) { throw "No se encontró el instalador NSIS." }
          if (-not $msi) { throw "No se encontró el instalador MSI." }
          Copy-Item $nsis.FullName "dist/lightmatter-setup.exe" -Force
          Copy-Item $msi.FullName "dist/lightmatter-setup.msi" -Force

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lightmatter-setup.exe
            dist/lightmatter-setup.msi
            dist/lightmatter-portable.zip
          draft: false
          generate_release_notes: true

      - name: Upload desktop bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: lightmatter-desktop-win
          path: |
            src-tauri/target/release/bundle/**
            dist/lightmatter-setup.exe
            dist/lightmatter-setup.msi
            dist/lightmatter-portable.zip
